<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>klikátor</title>
</head>
<body>
    <h1>KLIKÁTOR</h1>

    <h2>Počet kliknutí:
        <span id="counter"></span>
    </h2>

    <button onclick="addCnt();">klikni na mě</button>
    <button onclick="resetCnt();">Resetovat</button>
</body>
<script>
    console.log('start javascriptu')
    let count=0;
    function updateCnt() {
        const el = document.getElementById("counter")
        el.innerHTML = count;
    }

    updateCnt();

    function addCnt() {
        console.log('zvyseni counteru')
        count++;
        updateCnt();
    }
    function resetCnt() {
        console.log('reset counteru')
        count = 0;
        updateCnt();
    }
</script>
</html>
